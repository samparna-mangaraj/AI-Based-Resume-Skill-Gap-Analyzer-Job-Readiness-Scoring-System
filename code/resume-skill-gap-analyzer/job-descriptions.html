<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Descriptions — SkillGap Analyzer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a25;
            --glass-bg: rgba(21, 21, 31, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --neon-cyan: #00f5ff;
            --neon-purple: #bf00ff;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #606070;
            --border-color: #252535;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; padding: 60px 5%; }

        .header { text-align: center; margin-bottom: 60px; }
        .title { 
            font-size: 42px; font-weight: 800; margin-bottom: 12px;
            background: linear-gradient(135deg, #fff, var(--neon-cyan));
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        }
        .subtitle { color: var(--text-secondary); font-size: 18px; }

        .jobs-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); 
            gap: 24px; max-width: 1400px; margin: 0 auto; 
        }
        
        .job-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border); 
            border-radius: 20px; padding: 32px; transition: 0.3s;
            display: flex; flex-direction: column; gap: 20px;
        }
        .job-card:hover { transform: translateY(-8px); border-color: var(--neon-cyan); }
        
        .job-header { display: flex; align-items: center; gap: 16px; }
        .job-icon { 
            width: 50px; height: 50px; border-radius: 12px;
            background: rgba(0, 245, 255, 0.1); display: flex; 
            align-items: center; justify-content: center; font-size: 24px;
        }
        .job-title { font-size: 20px; font-weight: 700; }

        .roles-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .role-tag { 
            font-size: 12px; padding: 4px 10px; border-radius: 6px;
            background: var(--bg-tertiary); color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .skills-group { margin-top: 10px; }
        .group-label { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .skills-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .skill-chip {
            padding: 6px 12px; border-radius: 10px; font-size: 13px; font-weight: 500;
        }
        .skill-core { background: rgba(0, 245, 255, 0.1); border: 1px solid rgba(0, 245, 255, 0.3); color: var(--neon-cyan); }
        .skill-secondary { background: rgba(191, 0, 255, 0.1); border: 1px solid rgba(191, 0, 255, 0.3); color: var(--neon-purple); }
        
        .nav-back { 
            margin-bottom: 40px; display: inline-flex; align-items: center; gap: 8px;
            color: var(--text-secondary); text-decoration: none; font-weight: 500;
            transition: 0.2s;
        }
        .nav-back:hover { color: var(--neon-cyan); }

        @media (max-width: 768px) {
            .jobs-grid { grid-template-columns: 1fr; }
            .title { font-size: 32px; }
        }
    </style>
</head>
<body>

    <a href="index.html" class="nav-back">← Back to Home</a>

    <header class="header">
        <h1 class="title">Professional Job Descriptions</h1>
        <p class="subtitle">Standardized requirements and benchmarks for modern IT roles.</p>
    </header>

    <div class="jobs-grid" id="jobs-container">
        <!-- Dynamic Content -->
    </div>

    <script>
        async function loadJobs() {
            const container = document.getElementById('jobs-container');
            try {
                const response = await fetch('/api/v1/analysis/categories');
                const data = await response.json();
                
                container.innerHTML = data.categories.map(cat => `
                    <div class="job-card">
                        <div class="job-header">
                            <div class="job-icon">${cat.icon || '💼'}</div>
                            <div class="job-title">${cat.name}</div>
                        </div>
                        
                        <div style="font-size:13px; color:var(--text-secondary); line-height:1.5; white-space: pre-line;">
                            ${cat.description || ''}
                        </div>
                        
                        <div class="roles-list">
                            ${cat.roles.map(r => `<span class="role-tag">${r}</span>`).join('')}
                        </div>

                        <div class="skills-group">
                            <div class="group-label">Core Competencies</div>
                            <div class="skills-list">
                                ${cat.skills.core.map(s => `<span class="skill-chip skill-core">${s}</span>`).join('')}
                            </div>
                        </div>

                        <div class="skills-group">
                            <div class="group-label">Technical Stack</div>
                            <div class="skills-list">
                                ${cat.skills.secondary.map(s => `<span class="skill-chip skill-secondary">${s}</span>`).join('')}
                                ${cat.skills.bonus.map(s => `<span class="skill-chip skill-secondary">${s}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                `).join('');
                
            } catch (err) {
                container.innerHTML = '<p style="color:red; text-align:center; width:100%;">Failed to load job descriptions. Please try again later.</p>';
            }
        }
        loadJobs();
    </script>
</body>
</html>
