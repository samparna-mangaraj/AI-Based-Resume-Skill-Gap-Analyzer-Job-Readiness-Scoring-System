<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — SkillGap Analyzer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a25;
            --glass-bg: rgba(21, 21, 31, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --neon-cyan: #00f5ff;
            --neon-purple: #bf00ff;
            --neon-blue: #0080ff;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #606070;
            --border-color: #252535;
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
        body { background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; display: flex; align-items: center; justify-content: center;
          background: radial-gradient(circle at 10% 20%, rgba(0, 245, 255, 0.05), transparent 40%),
                      radial-gradient(circle at 90% 80%, rgba(191, 0, 255, 0.05), transparent 40%),
                      var(--bg-primary);
        }

        .auth-card {
            width: 100%; max-width: 440px; background: var(--glass-bg); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 28px; padding: 48px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); animation: slideUp 0.6s ease;
        }
        @keyframes slideUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }

        .auth-header { text-align: center; margin-bottom: 32px; }
        .logo-wrap { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .logo-icon { width: 44px; height: 44px; background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple)); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 0 20px rgba(0,245,255,0.35); }
        .auth-title { font-size: 32px; font-weight: 800; margin-bottom: 8px; background: linear-gradient(135deg, #fff, var(--neon-cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .auth-subtitle { color: var(--text-secondary); font-size: 15px; }

        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 14px; font-weight: 500; color: var(--text-secondary); margin-bottom: 10px; }
        .input-wrap { position: relative; }
        .form-input { width: 100%; padding: 14px 18px; background: var(--bg-secondary); border: 2px solid var(--border-color); border-radius: 14px; color: var(--text-primary); font-size: 15px; transition: 0.3s; outline: none; }
        .form-input:focus { border-color: var(--neon-cyan); box-shadow: 0 0 20px rgba(0, 245, 255, 0.15); }

        .toggle-pass { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 18px; }

        .btn-auth { width: 100%; padding: 16px; border-radius: 14px; font-weight: 700; font-size: 16px; cursor: pointer; border: none; background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue)); color: var(--bg-primary); box-shadow: 0 4px 20px rgba(0,245,255,0.3); transition: 0.3s; margin-top: 10px; }
        .btn-auth:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,245,255,0.4); }

        .auth-footer { text-align: center; margin-top: 32px; font-size: 14px; color: var(--text-secondary); }
        .auth-footer a { color: var(--neon-cyan); text-decoration: none; font-weight: 600; }
        .back-link { position: absolute; top: 40px; left: 40px; color: var(--text-secondary); text-decoration: none; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .back-link:hover { color: var(--neon-cyan); }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Back to Home</a>

    <main class="auth-card">
        <div class="auth-header">
            <div class="logo-wrap">
                <div class="logo-icon">⚡</div>
            </div>
            <h1 class="auth-title">Create Account</h1>
            <p class="auth-subtitle">Join SkillGap and unlock your potential</p>
        </div>

        <form id="register-form">
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" id="reg-name" class="form-input" placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" id="reg-email" class="form-input" placeholder="name@company.com" required>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="input-wrap">
                    <input type="password" id="reg-password" class="form-input" placeholder="Min. 6 characters" required minlength="6">
                    <button type="button" class="toggle-pass" onclick="SGA.togglePasswordVisibility('reg-password')">👁️</button>
                </div>
            </div>

            <button type="submit" class="btn-auth">Get Started</button>
        </form>

        <p class="auth-footer">
            Already have an account? <a href="login.html">Sign In</a>
        </p>
    </main>

    <script src="app.js"></script>
</body>
</html>
